<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AspireAI</title>
</head>
<body>
    <div class="auth-container">
        <h2>Login to AspireAI</h2>
        
        <!-- Flash messages with reusable JS selector -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message" style="color: red; margin-bottom: 10px;">
                  {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- ID added for JS binding -->
        <form id="authForm" action="{{ url_for('auth.login') }}" method="POST">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <!-- Type explicitly set to submit -->
            <button type="submit" id="submitBtn">Log In</button>
        </form>

        <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign Up</a></p>
    </div>

    <!-- Static JS Inclusion -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
